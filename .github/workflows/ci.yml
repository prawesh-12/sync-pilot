name: CI

on:
  push:
    branches: [main]
  pull_request:

# web/ and server/ are independent pnpm projects (separate lockfiles), so each
# is installed and checked in its own working directory.
jobs:
  # A test file outside tests/ matches no vitest include glob, so it would never
  # run and CI would still pass. This fails the build instead.
  test-layout:
    name: no tests outside tests/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every test file lives in tests/
        run: |
          stray=$(git ls-files '*.test.ts' '*.test.tsx' | grep -v '^tests/' || true)
          if [ -n "$stray" ]; then
            echo "These test files are outside tests/, so no vitest config runs them:"
            echo "$stray"
            echo "Move them into tests/web_test/ or tests/server_test/."
            exit 1
          fi
          echo "All $(git ls-files 'tests/**/*.test.ts' | wc -l) test files are under tests/."

  check:
    name: typecheck + test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [web, server]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ${{ matrix.package }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test

  lint:
    name: lint (web + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # Linted from the repo root: the tests are outside ESLint's base path.
      - run: pnpm run lint:tests
